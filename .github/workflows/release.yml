# Ao publicar uma tag vX.Y.Z: compila o Lume em Windows, Linux e macOS e cria o Release com os instaladores.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Versao (sem o v), so para testar o build"
        required: true
        default: "0.0.0"

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.15"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: ubuntu-22.04  # glibc mais antiga: o AppImage roda em mais distros
            name: linux
          - os: macos-latest   # Apple Silicon
            name: macos-arm64
          - os: macos-15-intel
            name: macos-intel
    runs-on: ${{ matrix.os }}
    env:
      LUME_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Versao sem o "v"
        shell: bash
        run: echo "LUME_VERSION=${LUME_VERSION#v}" >> "$GITHUB_ENV"

      - name: Bibliotecas do Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-image0 libxcb-render-util0 libxcb-shape0

      - name: Dependencias
        run: python -m pip install -r packaging/requirements-build.txt

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m PyInstaller packaging/lume.spec --noconfirm
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc /Q "/DAppVersion=$env:LUME_VERSION" packaging\lume.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: PYTHON=python bash packaging/build_linux.sh

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: PYTHON=python bash packaging/build_macos.sh

      - uses: actions/upload-artifact@v5
        with:
          name: lume-${{ matrix.name }}
          path: |
            dist/*-Setup.exe
            dist/*.AppImage
            dist/*.tar.gz
            dist/*.dmg
          if-no-files-found: error

  release:
    needs: build
    if: github.ref_type == 'tag' && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v6
        with:
          path: out
          merge-multiple: true
      - name: Criar o Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la out
          gh release create "$GITHUB_REF_NAME" out/* --title "Lume ${GITHUB_REF_NAME#v}" --notes-file packaging/RELEASE_NOTES.md
